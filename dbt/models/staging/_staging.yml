version: 2

models:
  - name: stg_taxi_trips
    description: >
      1:1 with raw.taxi_trips. Renames columns to consistent snake_case,
      derives trip_duration_minutes from pickup/dropoff timestamps, and
      passes every other column through unchanged. Contains only rows that
      passed the quality gate; quarantined rows are in stg_taxi_trips_quarantine.
    columns:
      - name: trip_id
        description: SHA-256 of (vendor_id, pickup_datetime, dropoff_datetime, pu_location_id). Deterministic surrogate key — the same logical trip always produces the same ID, making re-ingestion idempotent.
        tests: [unique, not_null]
      - name: vendor_id
        description: TLC vendor code (1 = Creative Mobile Technologies, 2 = VeriFone Inc.).
      - name: pickup_at
        description: Renamed from pickup_datetime. Timestamp when the taximeter engaged.
      - name: dropoff_at
        description: Renamed from dropoff_datetime. Timestamp when the taximeter was disengaged.
      - name: pickup_date
        description: Calendar date of pickup; derived from pickup_at. Primary partition key for mart_daily_trip_metrics.
        tests: [not_null]
      - name: passenger_count
        description: Number of passengers reported by the driver. Quality gate rejects values outside 1–6.
      - name: trip_distance
        description: Trip distance in miles as reported by the taximeter.
      - name: rate_code_id
        description: Renamed from ratecode_id. TLC rate code (1=Standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=Negotiated, 6=Group Ride).
      - name: pu_location_id
        description: TLC pickup taxi zone LocationID (valid range 1–265).
      - name: do_location_id
        description: TLC dropoff taxi zone LocationID (valid range 1–265).
      - name: payment_type_id
        description: Renamed from payment_type. TLC payment code (1=Credit Card, 2=Cash, 3=No Charge, 4=Dispute, 5=Unknown, 6=Voided Trip).
      - name: fare_amount
        description: Meter fare at end of trip in USD, excluding tips, surcharges, and tolls. Quality gate rejects values outside $0–$500.
      - name: tip_amount
        description: Tip amount in USD. Automatically populated for credit card payments; typically zero for cash.
      - name: tolls_amount
        description: Total tolls paid during the trip in USD.
      - name: total_amount
        description: Total charged to the passenger in USD (fare + surcharges + tip + tolls).
      - name: trip_duration_minutes
        description: Derived column — datediff(seconds, pickup_at, dropoff_at) / 60.0. Quality gate rejects trips where dropoff_at <= pickup_at.
      - name: run_id
        description: Foreign key to stg_pipeline_runs. Identifies which ingestion batch loaded this row.
      - name: ingested_at
        description: Timestamp when this row was written to the Snowflake table by the Python ingestion job.

  - name: stg_taxi_trips_quarantine
    description: >
      Rows diverted from raw ingestion because they failed at least one row-level
      quality check. Preserves the trip_id so quarantined rows can be traced back
      to their source and re-evaluated after a rule change. Does not contain
      fare or distance columns — those are never written for rejected rows.
    columns:
      - name: trip_id
        description: Same deterministic SHA-256 key as stg_taxi_trips. Enables joins to investigate why a row was quarantined.
      - name: pickup_date
        description: Calendar date of the trip's pickup, for partitioned inspection of quarantine volume.
      - name: failed_checks
        description: JSON array of check names that this row failed (e.g. ["fare_amount_0_500", "passenger_count_1_6"]). Used to diagnose source data quality issues per rule.
        tests: [not_null]
      - name: run_id
        description: Foreign key to stg_pipeline_runs. Identifies which ingestion run quarantined this row.

  - name: stg_pipeline_runs
    description: >
      1:1 with raw.pipeline_runs. Normalises status to lowercase, renames
      rows_ingested to rows_loaded for clarity, and coalesces rows_quarantined
      from null to 0 for runs predating the migration that added that column.
    columns:
      - name: run_id
        description: Unique identifier for the ingestion run, generated by the Python orchestrator (UUID).
        tests: [unique, not_null]
      - name: logical_date
        description: The calendar date the run was intended to ingest data for. May differ from the run's execution date for backfills.
      - name: started_at
        description: Timestamp when the run began.
      - name: completed_at
        description: Timestamp when the run finished. Null if the run crashed before writing a completion record.
      - name: status
        description: "Normalized to lowercase. Values: success, blocked, partial, failed."
        tests:
          - accepted_values:
              arguments:
                values: ["success", "blocked", "partial", "failed"]
      - name: source
        description: Data source identifier string (e.g. nyc_taxi_tlc). Reserved for multi-source expansion.
      - name: rows_loaded
        description: Renamed from rows_ingested. Rows that passed the quality gate and were written to raw.taxi_trips.
      - name: rows_quarantined
        description: Rows diverted to raw.taxi_trips_quarantine. Coalesced from null to 0 for runs before migration 002 that added this column.
      - name: rows_skipped
        description: Renamed from rows_failed. Rows dropped before quality evaluation due to fatal parse or schema errors.
      - name: duration_seconds
        description: Run wall-clock time in seconds, recorded by the orchestrator.
      - name: error_message
        description: Python exception message or pipeline error detail. Null on clean runs.

  - name: stg_quality_results
    description: >
      1:1 with raw.quality_results. Renames id to quality_result_id for
      clarity. One row per quality check per run — the raw audit trail of
      every Great Expectations evaluation. Severity (blocking vs row) is NOT
      here; it comes from joining quality_check_catalog in the intermediate layer.
    columns:
      - name: quality_result_id
        description: Renamed from id. Unique per check-per-run.
        tests: [unique, not_null]
      - name: run_id
        description: Foreign key to stg_pipeline_runs.
        tests:
          - relationships:
              arguments:
                to: ref('stg_pipeline_runs')
                field: run_id
      - name: check_name
        description: Name of the quality rule that was evaluated. Foreign key to quality_check_catalog.
        tests:
          - relationships:
              arguments:
                to: ref('quality_check_catalog')
                field: check_name
      - name: passed
        description: True if the check passed for this run; false otherwise.
      - name: score
        description: Numeric score returned by Great Expectations (1.0 = fully passed, 0.0 = fully failed, fractional for partial row-level results).
      - name: rows_checked
        description: Number of rows evaluated by this check. Null for schema-level blocking checks that operate on the whole batch rather than individual rows.
      - name: rows_failed
        description: Number of rows that did not satisfy the check's condition.
      - name: message
        description: Human-readable result message from Great Expectations describing what passed or failed.
      - name: checked_at
        description: Timestamp when this check was evaluated by the quality engine.
