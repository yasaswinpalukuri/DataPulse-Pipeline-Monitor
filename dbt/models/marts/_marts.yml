version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'DATAPULSE') }}"
    schema: raw
    description: >
      Written by the Python ingestion job (ingestion/run_once.py). All tables in
      this schema are append-only or full-replace per run; no in-place updates.
      Downstream dbt models are the only consumers — nothing reads raw directly.
    tables:
      - name: taxi_trips
        description: >
          Rows that passed the two-tier quality gate. One logical day is overwritten
          per run (full-replace pattern): if the same logical_date is re-ingested,
          the previous rows for that date are deleted before the new batch is written.
          Quarantined rows are never written here.
        columns:
          - name: trip_id
            description: SHA-256 deterministic surrogate key computed by the ingestion job.
          - name: vendor_id
            description: TLC vendor code.
          - name: pickup_datetime
            description: Timestamp when the taximeter engaged.
          - name: dropoff_datetime
            description: Timestamp when the taximeter was disengaged.
          - name: pickup_date
            description: Calendar date of pickup; partition key.
          - name: passenger_count
            description: Number of passengers reported by the driver.
          - name: trip_distance
            description: Distance in miles as reported by the taximeter.
          - name: ratecode_id
            description: TLC rate code.
          - name: pu_location_id
            description: TLC pickup taxi zone LocationID.
          - name: do_location_id
            description: TLC dropoff taxi zone LocationID.
          - name: payment_type
            description: TLC payment type code.
          - name: fare_amount
            description: Meter fare in USD.
          - name: tip_amount
            description: Tip in USD (auto-populated for card payments).
          - name: tolls_amount
            description: Tolls in USD.
          - name: total_amount
            description: Total charged to passenger in USD.
          - name: run_id
            description: Foreign key to pipeline_runs; identifies the batch that loaded this row.
          - name: ingested_at
            description: Timestamp when this row was written by the ingestion job.

      - name: taxi_trips_quarantine
        description: >
          Rows that failed at least one row-level quality check. Written in the same
          run that produces taxi_trips but diverted here instead of the main table.
          Used to diagnose source data quality issues without discarding the data.
        columns:
          - name: trip_id
            description: Same SHA-256 key as taxi_trips; enables cross-table investigation.
          - name: pickup_date
            description: Calendar date of pickup.
          - name: failed_checks
            description: JSON array of check names that this row failed.
          - name: run_id
            description: Foreign key to pipeline_runs.

      - name: pipeline_runs
        description: >
          One row per ingestion run written by the orchestrator at run completion.
          The freshness check (warn >36h, error >72h) makes dbt a passive monitor:
          if the cron job stops firing, the next dbt run surfaces an alert.
        config:
          loaded_at_field: started_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 72, period: hour}
        columns:
          - name: run_id
            description: UUID generated by the Python orchestrator; unique per run.
          - name: logical_date
            description: The calendar date the run ingested data for.
          - name: started_at
            description: Timestamp when the run began.
          - name: completed_at
            description: Timestamp when the run finished; null on crash.
          - name: status
            description: "Raw status string: SUCCESS, BLOCKED, PARTIAL, or FAILED (normalized to lowercase in staging)."
          - name: source
            description: Data source identifier (e.g. nyc_taxi_tlc).
          - name: rows_ingested
            description: Rows written to taxi_trips (renamed to rows_loaded in staging).
          - name: rows_quarantined
            description: Rows written to taxi_trips_quarantine. Null for runs before migration 002.
          - name: rows_failed
            description: Rows dropped before quality evaluation (renamed to rows_skipped in staging).
          - name: duration_seconds
            description: Run wall-clock time in seconds.
          - name: error_message
            description: Python exception or error detail; null on clean runs.

      - name: quality_results
        description: One row per quality check per run. Raw audit trail of every Great Expectations evaluation.
        columns:
          - name: id
            description: Auto-generated primary key (renamed to quality_result_id in staging).
          - name: run_id
            description: Foreign key to pipeline_runs.
          - name: check_name
            description: Name of the quality rule that was evaluated.
          - name: passed
            description: True if the check passed.
          - name: score
            description: Numeric score from Great Expectations (1.0 = fully passed).
          - name: rows_checked
            description: Rows evaluated; null for schema-level checks.
          - name: rows_failed
            description: Rows that did not satisfy the check.
          - name: message
            description: Human-readable result message from Great Expectations.
          - name: checked_at
            description: Timestamp when this check was evaluated.
