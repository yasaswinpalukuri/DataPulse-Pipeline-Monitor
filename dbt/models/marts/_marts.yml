version: 2

models:
  - name: mart_pipeline_runs
    description: >
      One row per ingestion run. The primary read surface for the /runs API
      endpoint and the dashboard's run history table. Every quality-related
      metric — quarantine rate, blocking failures, worst per-row failure rate —
      is pre-computed here so consumers never need to re-join to quality_results.
    columns:
      - name: run_id
        description: Unique identifier for the ingestion run, generated by the Python orchestrator.
        tests: [unique, not_null]
      - name: logical_date
        description: The calendar date the run was intended to ingest data for (e.g. 2024-01-15). Distinct from run_date in mart_pipeline_health_daily, which is the day the run was executed.
        tests: [not_null]
      - name: started_at
        description: Timestamp when the ingestion run began.
      - name: completed_at
        description: Timestamp when the run finished. Null if the run crashed before writing a completion record.
      - name: status
        description: "Outcome of the run: success (all checks passed, full load), blocked (a blocking check failed, load halted), partial (row-level failures quarantined some rows but load continued), or failed (unhandled exception)."
        tests:
          - accepted_values:
              values: ["success", "blocked", "partial", "failed"]
      - name: rows_loaded
        description: Rows that passed the quality gate and were written to raw.taxi_trips.
      - name: rows_quarantined
        description: Rows that failed at least one row-level quality check and were diverted to raw.taxi_trips_quarantine instead of the main table.
      - name: rows_skipped
        description: Rows dropped before quality evaluation due to fatal parse or schema errors.
      - name: quarantine_rate
        description: rows_quarantined / (rows_loaded + rows_quarantined), rounded to 4 decimal places. Null when both counts are zero.
      - name: duration_seconds
        description: Wall-clock seconds from started_at to completed_at, rounded to 1 decimal place.
      - name: checks_run
        description: Total number of Great Expectations checks executed in this run.
      - name: checks_failed
        description: Number of checks that did not pass in this run.
      - name: blocking_failures
        description: Count of checks with severity = blocking (from quality_check_catalog) that failed. Any value > 0 means the load was halted entirely.
        tests: [not_null]
      - name: worst_row_check_failure_rate
        description: Highest per-row failure rate across all row-level checks in this run. Null if no row-level checks ran. Useful for ranking run quality or setting alert thresholds.
      - name: error_message
        description: Python exception message or pipeline error detail. Null on clean runs.

  - name: mart_pipeline_health_daily
    description: >
      Pipeline health aggregated by the calendar day runs were executed
      (started_at date), not by logical_date. Answers "how did the pipeline
      behave on Monday?" including any manual backfills that ran that day.
      Used by the dashboard's daily health trend chart.
    columns:
      - name: run_date
        description: Calendar date (derived from started_at) on which one or more runs were executed.
        tests: [unique, not_null]
      - name: runs
        description: Total runs executed on this date, including manual backfills of older logical dates.
      - name: successful_runs
        description: Runs that completed with status = success.
      - name: blocked_runs
        description: Runs halted by a blocking quality check failure before any rows were loaded.
      - name: failed_runs
        description: Runs that errored with an unhandled exception before completing.
      - name: success_rate
        description: successful_runs / runs, rounded to 4 decimal places. The primary daily health KPI.
      - name: rows_loaded
        description: Total rows written to raw.taxi_trips across all runs on this date.
      - name: rows_quarantined
        description: Total rows diverted to raw.taxi_trips_quarantine across all runs on this date.
      - name: avg_duration_seconds
        description: Mean run wall-clock time in seconds across all runs on this date.
      - name: avg_quarantine_rate
        description: Mean quarantine rate across all runs on this date, rounded to 4 decimal places.

  - name: mart_quality_check_trends
    description: >
      One row per quality check per run. Powers the dashboard's "which rules
      fail most and is it getting worse?" trend chart. Severity is joined from
      quality_check_catalog so consumers can filter blocking vs row-level checks
      without knowing the check list in advance.
    columns:
      - name: run_id
        description: Foreign key to mart_pipeline_runs.
      - name: logical_date
        description: The calendar date the run's data represents. Used as the x-axis on trend charts.
      - name: started_at
        description: Timestamp when the run began. Used for time-series ordering when multiple runs share the same logical_date.
      - name: check_name
        description: Name of the quality rule from quality_check_catalog (e.g. fare_amount_0_500, trip_id_unique).
        tests: [not_null]
      - name: severity
        description: "blocking — a failure halts the entire load; row — a failure quarantines only the failing rows."
      - name: passed
        description: True if the check passed for this run; false otherwise.
      - name: rows_checked
        description: Number of rows evaluated by this check. Null for schema-level blocking checks that operate on the whole batch.
      - name: rows_failed
        description: Number of rows that did not satisfy the check's condition.
      - name: failure_rate
        description: rows_failed / rows_checked, rounded to 4 decimal places. Null when rows_checked is zero or null.

  - name: mart_daily_trip_metrics
    description: >
      Business-facing trip metrics aggregated by pickup date, computed only
      over rows that passed the quality gate (raw.taxi_trips via stg_taxi_trips).
      Quarantined rows are excluded. The tip rate is card-only because cash tips
      are not recorded by the TLC API.
    columns:
      - name: pickup_date
        description: Calendar date of pickups (YYYY-MM-DD). Primary key for this mart.
        tests: [unique, not_null]
      - name: trips
        description: Number of taxi trips with this pickup date in the quality-passed dataset.
      - name: revenue
        description: Sum of total_amount (fare + surcharges + tips + tolls) across all trips for this date, in USD rounded to 2 decimal places.
      - name: avg_fare
        description: Mean fare_amount (meter fare only, excluding tips and surcharges) per trip, in USD.
      - name: avg_distance_miles
        description: Mean trip_distance in miles as reported by the taximeter.
      - name: avg_duration_minutes
        description: Mean trip duration in minutes, computed from pickup and dropoff timestamps.
      - name: card_tip_rate
        description: Tip amount / fare amount for credit card payments only (payment_type_id = 1). Null or effectively 0 when no card payments occurred on this date. Cash tips are not captured by the source API.
