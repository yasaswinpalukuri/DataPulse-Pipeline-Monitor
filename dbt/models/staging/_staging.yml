version: 2

models:
  - name: stg_taxi_trips
    columns:
      - name: trip_id
        tests: [unique, not_null]
      - name: pickup_date
        tests: [not_null]
  - name: stg_taxi_trips_quarantine
    columns:
      - name: failed_checks
        tests: [not_null]
  - name: stg_pipeline_runs
    columns:
      - name: run_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["success", "blocked", "partial", "failed"]
  - name: stg_quality_results
    columns:
      - name: quality_result_id
        tests: [unique, not_null]
      - name: run_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_pipeline_runs')
                field: run_id
      - name: check_name
        tests:
          - relationships:
              arguments:
                to: ref('quality_check_catalog')
                field: check_name
