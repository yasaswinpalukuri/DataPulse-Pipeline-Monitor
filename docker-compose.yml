services:
  ingestion:
    build: .
    container_name: datapulse-ingestion
    restart: unless-stopped
    env_file: .env
    # No exposed ports -- this service only writes to Snowflake, it
    # doesn't serve anything. api/dashboard get their own service
    # blocks (and their own ports, offset to avoid colliding with
    # Groot's existing agent_service on 8000) once those are built.

