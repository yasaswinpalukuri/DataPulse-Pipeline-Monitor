version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'DATAPULSE') }}"
    schema: raw
    description: Written by the Python ingestion job (ingestion/run_once.py).
    tables:
      - name: taxi_trips
        description: Rows that passed the quality gate; one logical day overwritten per run.
      - name: taxi_trips_quarantine
        description: Rows that failed at least one row-level quality check.
      - name: pipeline_runs
        description: One row per ingestion run (success / blocked / partial / failed).
        # Freshness makes dbt a monitor too: if cron stops firing, this warns.
        config:
          loaded_at_field: started_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 72, period: hour}
      - name: quality_results
        description: One row per quality check per run.
